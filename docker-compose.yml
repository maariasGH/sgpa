services:

  # ── BASE DE DATOS ─────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: sgpa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./bd:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FRONTEND ─────────────────────────────────────────────────
  front-end:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_frontend
    volumes:
      - ./front-end:/app
    ports:
      - "5173:5173"
    environment:
      # El navegador usa el mismo origen; Vite reenvía /api al gateway por la red Docker.
      - GATEWAY_PROXY_TARGET=http://gateway:3000
      # Detecta cambios en el código montado desde Windows (sin esto Vite sirve versiones viejas)
      - VITE_POLLING=true
    command: sh -c "npm install && npm run dev -- --host"

  # ── API GATEWAY ───────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_gateway
    volumes:
      - ./gateway:/app
      - ./common:/common:ro
      - audit_queue:/data/audit
    ports:
      - "3010:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - MS_SALAS_URL=http://ms-salas:3002
      - MS_AUTORIDADES_URL=http://ms-autoridades:3003
      - MS_USUARIOS_URL=http://ms-usuarios:3004
      - MS_AUDIENCIAS_URL=http://ms-audiencias:3005
      - MS_AUDITORIA_URL=http://ms-auditoria:3006
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=5m
      - PORT=3000
      # Los DEBUG_TOKEN solo se aceptan con NODE_ENV=development (ver gateway/middleware/auth.js)
      - NODE_ENV=${NODE_ENV:-development}
      - DEBUG_TOKEN=${DEBUG_TOKEN}
      - DEBUG_TOKEN_OP=${DEBUG_TOKEN_OP}
      # Orígenes permitidos separados por coma. En development la red local (teléfono) se acepta sola
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AUDIT_QUEUE_FILE=/data/audit/pending.jsonl
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS DISTRITOS ─────────────────────────────────────────────
  ms-distritos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_distritos
    volumes:
      - ./ms-distritos:/app
      - ./common:/common:ro
    expose: ["3001"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_distritos
      - PORT=3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS SALAS ─────────────────────────────────────────────────
  ms-salas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_salas
    volumes:
      - ./ms-salas:/app
      - ./common:/common:ro
    expose: ["3002"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_salas
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - PORT=3002
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS AUTORIDADES ───────────────────────────────────────────
  ms-autoridades:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_autoridades
    volumes:
      - ./ms-autoridades:/app
      - ./common:/common:ro
    expose: ["3003"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_autoridades
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - MS_AUDIENCIAS_URL=http://ms-audiencias:3005
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_REPLY_TO=${SMTP_REPLY_TO:-}
      # Dirección de contacto que figura al pie de los emails a autoridades
      - SOPORTE_EMAIL=${SOPORTE_EMAIL:-}
      - PORT=3003
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS USUARIOS ──────────────────────────────────────────────
  ms-usuarios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_usuarios
    volumes:
      - ./ms-usuarios:/app
      - ./common:/common:ro
    expose: ["3004"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_usuarios
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      # Los emails a operadores (alta / baja) los envía ms-autoridades
      - MS_AUTORIDADES_URL=http://ms-autoridades:3003
      # Dirección de contacto que figura al pie de los emails a operadores
      - SOPORTE_EMAIL=${SOPORTE_EMAIL:-}
      # Solo para el texto del pie: el Reply-To lo pone ms-autoridades al enviar
      - SMTP_REPLY_TO=${SMTP_REPLY_TO:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=5m
      - PORT=3004
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS AUDIENCIAS ─────────────────────────────────────────────
  ms-audiencias:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_audiencias
    volumes:
      - ./ms-audiencias:/app
      - ./common:/common:ro
      # Grabaciones (MP4) de las audiencias
      - videos:/videos
    expose: ["3005"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_audiencias
      - MS_SALAS_URL=http://ms-salas:3002
      - MS_AUTORIDADES_URL=http://ms-autoridades:3003
      - MS_USUARIOS_URL=http://ms-usuarios:3004
      - VIDEOS_DIR=/videos
      # Tamaño máximo de una grabación en MB
      - VIDEO_MAX_MB=${VIDEO_MAX_MB:-2048}
      - PORT=3005
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── MS AUDITORIA ──────────────────────────────────────────────
  ms-auditoria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_auditoria
    volumes:
      - ./ms-auditoria:/app
      - ./common:/common:ro
    expose: ["3006"]
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_auditoria
      - PORT=3006
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

# ── VOLÚMENES ────────────────────────────────────────────────
# Datos persistentes de PostgreSQL. Los scripts de bd/ solo corren si está vacío:
# para re-inicializar la base: docker compose down -v
volumes:
  pgdata:
  # Logs pendientes del gateway; se conserva entre recreaciones del servicio.
  audit_queue:
  # Grabaciones de audiencias subidas desde el panel (ms-audiencias)
  videos:
