services:

  # ── BASE DE DATOS ─────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: sgpa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - ./bd:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FRONTEND ─────────────────────────────────────────────────
  front-end:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_frontend
    volumes:
      - ./front-end:/app
    ports:
      - "5173:5173"
    environment:
      # URL del gateway vista desde el navegador (no desde el contenedor)
      - VITE_API_URL=http://localhost:3000
    command: sh -c "npm install && npm run dev -- --host"

  # ── API GATEWAY ───────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_gateway
    volumes:
      - ./gateway:/app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - MS_SALAS_URL=http://ms-salas:3002
      - MS_AUTORIDADES_URL=http://ms-autoridades:3003
      - MS_USUARIOS_URL=http://ms-usuarios:3004
      - MS_AUDIENCIAS_URL=http://ms-audiencias:3005
      - MS_AUDITORIA_URL=http://ms-auditoria:3006
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=5m
      - PORT=3000
      - DEBUG_TOKEN=${DEBUG_TOKEN}
      - DEBUG_TOKEN_OP=${DEBUG_TOKEN_OP}
      - CORS_ORIGIN=http://localhost:5173
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS DISTRITOS ─────────────────────────────────────────────
  ms-distritos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_distritos
    volumes:
      - ./ms-distritos:/app
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_distritos
      - PORT=3001
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS SALAS ─────────────────────────────────────────────────
  ms-salas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_salas
    volumes:
      - ./ms-salas:/app
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_salas
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - PORT=3002
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS AUTORIDADES ───────────────────────────────────────────
  ms-autoridades:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_autoridades
    volumes:
      - ./ms-autoridades:/app
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_autoridades
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - MS_AUDIENCIAS_URL=http://ms-audiencias:3005
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - PORT=3003
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS USUARIOS ──────────────────────────────────────────────
  ms-usuarios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_usuarios
    volumes:
      - ./ms-usuarios:/app
    ports:
      - "3004:3004"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_usuarios
      - MS_DISTRITOS_URL=http://ms-distritos:3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=5m
      - PORT=3004
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS AUDIENCIAS ─────────────────────────────────────────────
  ms-audiencias:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_audiencias
    volumes:
      - ./ms-audiencias:/app
    ports:
      - "3005:3005"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_audiencias
      - MS_SALAS_URL=http://ms-salas:3002
      - MS_AUTORIDADES_URL=http://ms-autoridades:3003
      - MS_USUARIOS_URL=http://ms-usuarios:3004
      - PORT=3005
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # ── MS AUDITORIA ──────────────────────────────────────────────
  ms-auditoria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgpa_ms_auditoria
    volumes:
      - ./ms-auditoria:/app
    ports:
      - "3006:3006"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SCHEMA=sgpa_auditoria
      - PORT=3006
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

# ── VOLÚMENES ────────────────────────────────────────────────
# Datos persistentes de PostgreSQL. Los scripts de bd/ solo corren si está vacío:
# para re-inicializar la base: docker compose down -v
volumes:
  pgdata:
